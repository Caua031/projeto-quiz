<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela inicial de cadastro</title>
    <link rel="stylesheet" href="styleinicial.css">
</head>
<body>

    <div class="cadastro">
        <img src="/imagens/perfil.png" alt="Foto de perfil">
        <h1>Digite seu nome</h1>

        <form id="form-registro">
            <input type="text" id="nome-jogador" placeholder="Ex: Dexter" required>
        </form>

        <button type="submit" class="btn-proximo">Continuar</button>
    </div>
    
</body>
</html>
