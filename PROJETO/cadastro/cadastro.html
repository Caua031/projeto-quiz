<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela inicial de cadastro</title>
    <link rel="stylesheet" href="styleinicial.css">
</head>
<body>

    <main class="cadastro">

        <div class="avatar-container" id="abrir-galeria">
            <img id="foto-atual" src="../imagens/perfil.png" alt="Foto de perfil">
            <div class="overlay-trocar">Mudar 🔄</div>
        </div>

        <h1>Digite seu nome</h1>

        <form id="form-registro">
            <input type="text" id="nome-jogador" placeholder="EX:OSVALDO MECARONICO" required>
            <button type="submit" id="proximo-btn">Continuar</button>
        </form>
        
    </main>

        <div id="janela-avatares" class="modal-avatares">
            <div class="modal-conteudo">
                <h2>Escolha seu Avatar</h2>
                <div class="lista-fotos">
                    <img class="opcao-avatar" src="../imagens/01.jpg" alt="Avatar 1">
                    <img class="opcao-avatar" src="../imagens/02.jpg" alt="Avatar 2">
                    <img class="opcao-avatar" src="../imagens/03.jpg" alt="Avatar 3">
                    <img class="opcao-avatar" src="../imagens/04.jpg" alt="Avatar 4">
                </div>
                <button type="button" id="fechar-galeria">Fechar</button>
            </div>
        </div>

    <script src="cadastro.js"></script>
</body>
</html>
