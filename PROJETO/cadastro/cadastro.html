<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar — Tech Trivia</title>
    <link rel="stylesheet" href="styleinicial.css">
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    
    <div class="principal">
        <h1>Seja Bem-vindo(a) ao quiz sobre cibersegurança</h1>
    </div>

    <main class="cadastro">
        <div class="auth-abas" role="group" aria-label="Acesso à conta">
            <button type="button" id="aba-login" aria-pressed="true">Entrar</button>
            <button type="button" id="aba-cadastro" aria-pressed="false">Criar conta</button>
        </div>
        <div class="avatar-container somente-cadastro" id="abrir-galeria" hidden role="button" tabindex="0" aria-label="Escolher avatar">
            <img id="foto-atual" src="../imagens/perfil.png" alt="Foto de perfil">
            <div class="overlay-trocar">Mudar 🔄</div>
        </div>

        <h1 id="titulo-acesso">Entre na sua conta</h1>

        <form id="form-registro">
            <label for="nome-jogador">Nome de usuário</label>
            <input type="text" id="nome-jogador" autocomplete="username" minlength="3" maxlength="40" placeholder="Ex.: osvaldo" required>
            <label for="senha-jogador">Senha</label>
            <input type="password" id="senha-jogador" autocomplete="current-password" maxlength="128" required>
            <div class="somente-cadastro" hidden>
                <label for="confirmar-senha">Confirmar senha</label>
                <input type="password" id="confirmar-senha" autocomplete="new-password" maxlength="128" disabled>
                <p class="auth-ajuda">Use de 3 a 40 letras, números, pontos, traços ou sublinhados no nome de usuário. A senha deve ter de 8 a 128 caracteres.</p>
            </div>
            <p id="status-acesso" role="status" aria-live="polite"></p>
            <button type="submit" id="proximo-btn">Entrar</button>
        </form>
        
    </main>

        <div id="janela-avatares" class="modal-avatares">
            <div class="modal-conteudo">
                <h2>Escolha seu Avatar</h2>
                <div class="lista-fotos">
                    <img class="opcao-avatar" src="../imagens/01.jpg" alt="Avatar 1">
                    <img class="opcao-avatar" src="../imagens/02.jpg" alt="Avatar 2">
                    <img class="opcao-avatar" src="../imagens/03.jpg" alt="Avatar 3">
                    <img class="opcao-avatar" src="../imagens/04.jpg" alt="Avatar 4">
                </div>
                <button type="button" id="fechar-galeria">Fechar</button>
            </div>
        </div>

    <script src="../api.js"></script>
    <script src="cadastro.js"></script>
    <script src="../fundoicones.js"></script>
</body>
</html>
