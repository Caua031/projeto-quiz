<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio Categorias Quiz</title>
    <link rel="stylesheet" href="categorias.css">
    <link rel="stylesheet" href="../conta.css">
</head>
<body>
    <canvas id="background"></canvas>

    <!-- Campo de Busca -->
    <header class="cabecalho">
        <h1>Categorias sobre Cibersegurança</h1>
        <div class="busca-container">
            <img src="../imagens/lupa.png" alt="Lupa de pesquisa">
            <input type="text" id="campoBusca" placeholder="Digite uma categoria.">
        </div>
    </header> 

    <section class="container-categorias">
        <!-- Lista de Categorias: montada pelo categoria.js com o que a API devolve (GET /api/categorias) -->
        <ul class="lista-categorias" id="listaCategorias"></ul>
        <p class="status-categorias" id="statusCategorias">Carregando categorias...</p>
    </section>

    <footer class="rodape">
        <h1>escolha uma dificuldade</h1>
        <div class="escolha-dificuldades">
            <!-- data-dificuldade = id_dificuldade no banco (1 Fácil, 2 Médio, 3 Difícil). Sem escolher, vale qualquer dificuldade. -->
            <button type="button" class="btn-dificuldade btn-1" data-dificuldade="1">Facil</button>
            <button type="button" class="btn-dificuldade btn-2" data-dificuldade="2">Medio</button>
            <button type="button" class="btn-dificuldade btn-3" data-dificuldade="3">Dificil</button>
        </div>
    </footer>

    <script src="../api.js"></script>
    <script src="background.js"></script>
    <script src="categoria.js"></script>
</body>
</html>
