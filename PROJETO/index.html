<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="background-icons">
        <span class="icon icon1">❓</span>
        <span class="icon icon2">💡</span>
        <span class="icon icon3">🧠</span>
        <span class="icon icon4">⭐</span>
        <span class="icon icon5">🏆</span>
        <span class="icon icon6">📚</span>
        <span class="icon icon7">🎯</span>
        <span class="icon icon8">❓</span>
    </div>

    <header class="cabecalho">

        <div class="perfil">
            <img src="imagens/02.jpg" alt="Foto de perfil">
            <h1>pergunta 2/10</h1>
        </div>

        <div class="score">
            <h1 class="pontos">pontos:1000</h1>
        </div>

    </header>

    <div class="app">

        <div class="quiz">

            <div id="progress"></div>

            <h2 id="question">Ele recebe o sinal de internet de um modem
                e distribui essa conexão para celulares, computadores
                e outros aparelhos, seja por cabos de rede ou por sinal Wi-Fi.
            </h2>
            
            <div class="answer-btn">
                <button class="btn">
                    <img src="imagens/um-amarelo.png" alt="Numero Um">
                    <span>Pergunta 1</span>
                </button>

                <button class="btn">
                    <img src="imagens/dois-amarelo.png" alt="Numero Dois">
                    <span>Pergunta 2</span>
                </button>

                <button class="btn">
                    <img src="imagens/tres-amarelo.png" alt="Numero Tres">
                    <span>Pergunta 3</span>
                </button>

                <button class="btn">
                    <img src="imagens/quatro-amarelo.png" alt="Numero Quatro">
                    <span>Pergunta 4</span>
                </button>
            </div>

            <main class="container">
                <h1>PARABÉNS!</h1>
                <h2>AAAAAAAAAAAAAAAAAAAH! QUE ACERTO</h2>
            </main>
            
            <button id="next-btn">Proximo</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
