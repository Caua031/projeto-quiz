<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raking Jogadores</title>
    <link rel="stylesheet" href="stylerank.css">
</head>
<body>

    <header class="cabecalho">
        <button id="btn-voltar">Voltar</button>
        <h1>RANK ATUAL</h1>
    </header>

    <main class="raking-jogadores">

            <ul class="class-jogadores">

                <li class="list-jogador">
                    <img src="../imagens/01.jpg" alt="Foto Avatar">
                    <h1>Jogador 2</h1>
                    <div class="barra-ranking barra-1">
                        <h2>2</h2>
                        <h3>10.000 PTS</h3>
                    </div>
                </li>

                <li class="list-jogador">
                    <img src="../imagens/01.jpg" alt="Foto Avatar">
                    <h1>Jogador 1</h1>
                    <div class="barra-ranking barra-2">
                        <h2>1</h2>
                        <h3>16.000 PTS</h3>
                    </div>
                </li>

                <li class="list-jogador">
                    <img src="../imagens/01.jpg" alt="Foto Avatar">
                    <h1>Jogador 3</h1>
                    <div class="barra-ranking barra-3">
                        <h2>3</h2>
                        <h3>5.000 PTS</h3>
                    </div>
                </li>                                
            </ul>
    </main>

    <section class="container">
        <ul class="list-raking">
            <li class="raking">
                <h1>4</h1>
                <img src="/imagens/01.jpg" alt="Foto de perfil">
                <h2>Eduardo Steblitech</h2>
                <h3>1000 PTS</h3>
            </li>

            <li class="raking">
                <h1>5</h1>
                <img src="/imagens/02.jpg" alt="Foto de perfil">
                <h2>Vande Mortys</h2>
                <h3>900 PTS</h3>
            </li>  

            <li class="raking">
                <h1>6</h1>
                <img src="/imagens/03.jpg" alt="Foto de perfil">
                <h2>Hailand Mexican</h2>
                <h3>800 PTS</h3>
            </li> 

            <li class="raking">
                <h1>7</h1>
                <img src="/imagens/04.jpg" alt="Foto de perfil">
                <h2>Arthus Zinco</h2>
                <h3>678 PTS</h3>
            </li>            
        </ul>
    </section>
    <script src="raking.js"></script>
</body>
</html>
