<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raking Jogadores</title>
    <link rel="stylesheet" href="stylerank.css">
</head>
<body>

    <header class="cabecalho">
        <button id="btn-voltar">Voltar</button>
        <h1>RANK ATUAL</h1>
    </header>

    <main class="container">
        <section class="raking-jogadores">
            <ul class="class-jogadores">

                <li class="list-jogador">
                    <img src="../imagens/perfil.png" alt="Foto Avatar">
                    <h1>Jogador 2</h1>

                    <div class="barra-ranking barra-1">
                        <h2>2</h2>
                        <h3>10.000 PTS</h3>
                    </div>

                </li>

                <li class="list-jogador">
                    <img src="../imagens/perfil.png" alt="Foto Avatar">
                    <h1>Jogador 1</h1>
                    
                    <div class="barra-ranking barra-2">
                        <h2>1</h2>
                        <h3>16.000 PTS</h3>
                    </div>
                </li>

                <li class="list-jogador">
                    <img src="../imagens/perfil.png" alt="Foto Avatar">
                    <h1>Jogador 3</h1>

                    <div class="barra-ranking barra-3">
                        <h2>3</h2>
                        <h3>5.000 PTS</h3>
                    </div>
                </li>                                
            </ul>

        </section>
    </main>
    
</body>
</html>
